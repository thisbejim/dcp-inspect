[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcp-inspect"
version = "0.1.0"
description = "Inspect and compare PyTorch Distributed Checkpoint metadata before loading tensors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "James" }]
keywords = ["pytorch", "distributed-checkpoint", "fsdp", "checkpoint", "training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dcp = ["torch>=2.5"]
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
dcp-inspect = "dcp_inspect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcp_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["dcp_inspect"]
